<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Add User</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }
        .wrap {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 16px 24px;
        }
        .panel {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
        }
        h1 {
            margin: 0 0 14px;
            font-size: 24px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .full {
            grid-column: 1 / -1;
        }
        label {
            font-size: 13px;
            color: #4b5563;
        }
        input, textarea, button {
            font: inherit;
        }
        input, textarea {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 9px 10px;
            background: #fff;
        }
        textarea {
            min-height: 88px;
            resize: vertical;
        }
        button {
            border: 0;
            border-radius: 8px;
            background: #111827;
            color: #fff;
            padding: 10px 14px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .result {
            margin-top: 14px;
            font-size: 14px;
        }
        .ok { color: #166534; }
        .err { color: #b91c1c; }
        .preview-card {
            margin-top: 18px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #fff;
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 16px;
        }
        .preview-title {
            margin: 0 0 8px;
            font-size: 22px;
        }
        .preview-role {
            margin: 0 0 14px;
            color: #374151;
            font-size: 15px;
        }
        .preview-section {
            margin: 0 0 10px;
            white-space: pre-line;
            font-size: 14px;
            color: #111827;
        }
        .preview-side {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .avatar-ph {
            width: 220px;
            height: 220px;
            border-radius: 10px;
            border: 1px dashed #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            background: #f8fafc;
            text-align: center;
            padding: 8px;
            box-sizing: border-box;
        }
        #qrBox {
            min-height: 120px;
            min-width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px;
        }
        @media (max-width: 900px) {
            .grid, .preview-card {
                grid-template-columns: 1fr;
            }
            .avatar-ph {
                width: 100%;
                max-width: 260px;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="panel">
            <h1>Admin: Add user</h1>
            <form id="addUserForm" class="grid">
                <div class="field full">
                    <label for="admin_secret">Admin secret (X-Admin-Secret)</label>
                    <input id="admin_secret" name="admin_secret" type="password" autocomplete="off" />
                </div>
                <div class="field">
                    <label for="tg_id">tg_id (optional)</label>
                    <input id="tg_id" name="tg_id" type="number" />
                </div>
                <div class="field">
                    <label for="username">username (optional)</label>
                    <input id="username" name="username" placeholder="@username or username" />
                </div>

                <div class="field full">
                    <label for="full_name">full_name</label>
                    <input id="full_name" name="full_name" required />
                </div>
                <div class="field full">
                    <label for="title">title / role</label>
                    <input id="title" name="title" />
                </div>
                <div class="field full">
                    <label for="services">services</label>
                    <textarea id="services" name="services"></textarea>
                </div>
                <div class="field">
                    <label for="monthly_turnover_range">monthly_turnover_range</label>
                    <input id="monthly_turnover_range" name="monthly_turnover_range" />
                </div>
                <div class="field">
                    <label for="yearly_turnover_range">yearly_turnover_range</label>
                    <input id="yearly_turnover_range" name="yearly_turnover_range" />
                </div>
                <div class="field full">
                    <label for="team_size">team_size</label>
                    <input id="team_size" name="team_size" />
                </div>
                <div class="field full">
                    <label for="key_competencies">key_competencies</label>
                    <textarea id="key_competencies" name="key_competencies"></textarea>
                </div>
                <div class="field full">
                    <label for="club_audience_request">club_audience_request</label>
                    <textarea id="club_audience_request" name="club_audience_request"></textarea>
                </div>
                <div class="field full">
                    <label for="hobbies">hobbies</label>
                    <textarea id="hobbies" name="hobbies"></textarea>
                </div>
                <div class="field full">
                    <label for="help_topics">help_topics</label>
                    <textarea id="help_topics" name="help_topics"></textarea>
                </div>
                <div class="field">
                    <label for="instagram_handle">instagram_handle</label>
                    <input id="instagram_handle" name="instagram_handle" placeholder="@handle" />
                </div>
                <div class="field">
                    <label for="qr_url">qr_url</label>
                    <input id="qr_url" name="qr_url" placeholder="https://..." />
                </div>
                <div class="field full">
                    <label for="tags">tags (comma or new line separated)</label>
                    <textarea id="tags" name="tags" placeholder="marketing, sales, fintech"></textarea>
                </div>
                <div class="field">
                    <label for="create_active_session">create_active_session</label>
                    <input id="create_active_session" name="create_active_session" type="checkbox" />
                </div>
                <div class="field">
                    <label for="session_hours">session_hours</label>
                    <input id="session_hours" name="session_hours" type="number" step="0.25" min="0.25" max="24" value="1" />
                </div>
                <div class="field">
                    <label for="lat">lat (required if session enabled)</label>
                    <input id="lat" name="lat" type="number" step="any" placeholder="51.16" />
                </div>
                <div class="field">
                    <label for="lon">lon (required if session enabled)</label>
                    <input id="lon" name="lon" type="number" step="any" placeholder="71.47" />
                </div>

                <div class="field full">
                    <button id="submitBtn" type="submit">Create user</button>
                </div>
            </form>

            <div id="result" class="result"></div>

            <div id="preview" class="preview-card" style="display:none;">
                <div>
                    <h2 class="preview-title" id="p_full_name"></h2>
                    <p class="preview-role" id="p_title"></p>
                    <p class="preview-section" id="p_services"></p>
                    <p class="preview-section" id="p_turnover"></p>
                    <p class="preview-section" id="p_team_size"></p>
                    <p class="preview-section" id="p_key_competencies"></p>
                    <p class="preview-section" id="p_club_audience_request"></p>
                    <p class="preview-section" id="p_hobbies"></p>
                    <p class="preview-section" id="p_help_topics"></p>
                </div>
                <div class="preview-side">
                    <div class="avatar-ph">Image placeholder</div>
                    <div id="qrBox"></div>
                    <a id="instagramLink" href="#" target="_blank" rel="noopener noreferrer"></a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/static/js/admin_add_user.js"></script>
</body>
</html>
